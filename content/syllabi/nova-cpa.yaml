# Nova CPA — Certificado Profissional Anbima
#
# Substitui a CPA-10 (descontinuada em 12/2025) como certificação obrigatória
# de entrada no mercado financeiro brasileiro. Direcionada a profissionais em
# início de carreira; após a CPA, o caminho natural é C-Pro R (Relacionamento)
# e C-Pro I (Investimento).
#
# Fonte: Programa Detalhado CPA-ANBIMA, versão 1.2 (revisada em 04/06/2025),
#        elaborado em 02/09/2024, vigência a partir de 01/01/2026.
# PDF oficial: Programa-Detalhado-CPA-ANBIMA.pdf (em raiz do repo)
#
# Estrutura: ementa oficial tem até 5 níveis de aninhamento. Aqui colapsamos
# em 2 níveis (módulo → tópico) para servir de PK lógico das questões. Os
# subtópicos detalhados ficam em `keywords` para contexto da geração e como
# âncora do `source_citation` (item X.Y.Z do PD).

track: nova-cpa
issuer: ANBIMA
version: "PD 1.2 (vigência 01/01/2026)"
status: active
effective_from: "2026-01-01"
url: https://www.anbima.com.br/pt_br/educar/certificacoes/cpa.htm
source_pdf: "Programa-Detalhado-CPA-ANBIMA.pdf"

exam_format:
  questions: 50
  duration_min: 120
  passing_score: 0.70

