        keywords: ["LINDB", "vacatio legis", "vigência"]
        official_reference: "Edital OAB 1ª Fase, Civil — LINDB"
      - slug: pessoas
        name: "Pessoas naturais e jurídicas, capacidade"
        keywords: ["personalidade", "capacidade", "incapazes"]
        official_reference: "Edital OAB 1ª Fase, Civil — Pessoas"
      - slug: contratos
        name: "Teoria geral dos contratos e contratos em espécie"
        keywords: ["contrato", "boa-fé objetiva", "função social", "compra e venda", "locação"]
        official_reference: "Edital OAB 1ª Fase, Civil — Contratos"
      - slug: responsabilidade-civil
        name: "Responsabilidade civil"
        keywords: ["responsabilidade", "dano", "nexo causal", "culpa", "objetiva"]
        official_reference: "Edital OAB 1ª Fase, Civil — Responsabilidade"
      - slug: obrigacoes
