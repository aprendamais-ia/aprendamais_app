# OAB — Edital Unificado da Primeira Fase
# Pesos calculados sobre 80 questões totais.
# Distribuição confirmada via análise FGV: Civil 9, Ética 8, Penal 7;
# Tributário/Administrativo/Trabalho/Processo Trabalho/Processo Penal/Empresarial = 5 cada;
# demais ramos = 2 cada (somam 18).
# IMPORTANTE: validar contra Edital Unificado vigente antes de gerar conteúdo.
# Calendário 46º Exame: 1ª fase 03/05/2026.

track: oab
issuer: OAB Federal / FGV (banca)
version: "46-XLVI"
url: https://oab.fgv.br/

exam_format:
  questions: 80
  duration_min: 300
  passing_score: 0.50

# weight = questões_disciplina / 80
modules:
  - slug: direito-civil
    name: "Direito Civil"
    weight: 0.1125  # 9 questões
    questions_in_exam: 9
